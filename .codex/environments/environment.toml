version = 1
name = "skibo"

[setup]
script = """
set -eu

source_env="$HOME/workspace/skibo/.env"

if [ ! -f "$source_env" ]; then
  echo "Missing source environment file: $source_env" >&2
  exit 1
fi

if [ -e .env ] && [ ! -L .env ]; then
  echo "Refusing to replace the existing non-symlink .env" >&2
  exit 1
fi

ln -sfn "$source_env" .env
"""
